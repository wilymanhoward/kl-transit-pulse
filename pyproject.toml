[project]
name = "kl-transit-pulse"
version = "0.1.0"
description = "Measures how reliable Kuala Lumpur buses are, using data.gov.my GTFS feeds."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "gtfs-realtime-bindings>=1.0",
    "sqlalchemy>=2.0",
    "alembic>=1.20.1",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
