services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-transit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transit}
      POSTGRES_DB: ${POSTGRES_DB:-transit}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only when the volume is first created: makes the transit_test database.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-transit}:${POSTGRES_PASSWORD:-transit}@db:5432/${POSTGRES_DB:-transit}
    depends_on:
      db:
        condition: service_healthy
    # Phase 1: migrate, load the timetable, exit. Later phases replace this with the API/worker.
    command: ["sh", "-c", "alembic upgrade head && python -m app.gtfs_static"]

volumes:
  pgdata:
