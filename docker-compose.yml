services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-transit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transit}
      POSTGRES_DB: ${POSTGRES_DB:-transit}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only when the volume is first created: makes the transit_test database.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

  # One-shot: apply migrations, then exit. worker and api wait for it to succeed,
  # so only one process ever migrates.
  migrate:
    build: .
    image: kl-transit-pulse
    environment: &app-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-transit}:${POSTGRES_PASSWORD:-transit}@db:5432/${POSTGRES_DB:-transit}
      POLL_SECONDS: ${POLL_SECONDS:-30}
      RETENTION_DAYS: ${RETENTION_DAYS:-14}
      STALE_AFTER_SECONDS: ${STALE_AFTER_SECONDS:-300}
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  # Polls realtime every 30 s, refreshes the timetable daily, prunes old positions.
  worker:
    image: kl-transit-pulse
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]

  api:
    image: kl-transit-pulse
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  pgdata:
